services:
  - type: web
    name: memoria-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run db:generate --workspace @memoria/server && npm run build --workspace @memoria/server
    startCommand: npm run db:deploy --workspace @memoria/server && npm run create-doctor --workspace @memoria/server && npm run start --workspace @memoria/server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: INITIAL_DOCTOR_EMAIL
        sync: false
      - key: INITIAL_DOCTOR_PASSWORD
        sync: false
